[fps_patch]
; Master switch for FPS changes. Restart after editing.
enabled=1

; Requested ceiling: 45, 60, 75, or 90. This release starts at 60.
; A higher ceiling does not guarantee that the hardware can render that rate.
target_fps=60

; Adaptive protection against FPS-patch-induced simulation slowdown.
; 1 = lower the effective client rate in 15-FPS steps, down to stock 30,
; after sustained overload. After 5 s stable, try +15 FPS for 2 s, up to
; target_fps (including 90). Failed trials roll back; stable retry waits
; increase to 10/20/40/60 s. Paused time does not count toward recovery.
; 0 = fixed requested rate; missing that rate can slow the native schedule.
stall_guard=1

; Off by default. Set both to 1 when collecting FPS scheduling logs.
; Logs go beside this file; TIMING rows are not displayed FPS.
logging=0
diagnostics=0
